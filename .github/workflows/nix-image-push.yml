name: Build a Nix image and push to Harbor

# Reusable workflow (workflow_call) that builds an OCI image with Nix
# (dockerTools, exposed as a flake attribute that produces an image tarball),
# and pushes it with skopeo to the Rehosting Arc Harbor registry (and optionally
# Docker Hub). The push reads the docker-archive `nix build` produced directly;
# it deliberately does NOT go through `docker load` + `docker push`, which
# published dockerTools' uncompressed layer diffs as-is (see the Tag and push
# step for the size regression that caused).
#
# It is the Nix counterpart of build-and-push.yml: same REGISTRY/USER/TARGET
# fallback ladder, same arc-registry-setup login, same extra-tags / dockerhub
# handling — but the image is produced by `nix build <flake-attr>` instead of
# buildx, so there is no Dockerfile or registry buildx cache (Nix caches via
# Cachix through nix-setup instead).
#
# Callers pin it as:
#   uses: rehosting/ci/.github/workflows/nix-image-push.yml@v1

on:
  workflow_call:
    inputs:
      image:
        description: Image repo under the registry namespace, e.g. rehosting/fw2tar
        type: string
        required: true
      flake-attr:
        description: Flake attribute that builds the image tarball
        type: string
        default: .#dockerImage
      runs-on:
        description: Runner label (must have Nix + Docker; e.g. rehosting-arc)
        type: string
        default: rehosting-arc
      push:
        type: boolean
        default: true
      tag-sha:
        description: Tag the image <target>/<image>:<github.sha>
        type: boolean
        default: true
      extra-tags:
        description: Additional fully-qualified tags, one per line
        type: string
        default: ""
      flake-check:
        description: Run `nix flake check` before building
        type: boolean
        default: false
      extra-build-args:
        description: >-
          Extra arguments appended to the `nix build` invocation (e.g. --impure
          when the flake reads a build-time env var).
        type: string
        default: ""
      build-env:
        description: >-
          Environment variables to export before `nix build`, one KEY=VALUE per
          line. Useful with --impure for injecting e.g. a release version the
          flake reads via builtins.getEnv.
        type: string
        default: ""
      dockerhub-user:
        description: Docker Hub username (used only when the dockerhub-token secret is set).
        type: string
        default: ""
      cachix-name:
        description: Cachix cache name for the Nix store (empty = no Cachix)
        type: string
        default: ""
      checkout-ref:
        type: string
        default: ""
      fetch-depth:
        type: number
        default: 0
      enable-kvm:
        description: >-
          Forwarded to nix-setup. Self-hosted Arc pods that expose /dev/kvm
          without a working udevd make install-nix-action's KVM setup fail; set
          false for pure Nix image builds that don't need a VM.
        type: boolean
        default: true
      cachix-skip-push:
        description: >-
          Forwarded to nix-setup's skip-push. Set true when the Cachix token is
          pull-only (so the post-step push doesn't 403). Empty = nix-setup's
          default (push only on non-PR events).
        type: string
        default: ""
      nix-install-url:
        description: >-
          Forwarded to nix-setup's install-url (cachix installer). Pin a specific
          Nix release when a repo's flake.lock was generated by a newer Nix than
          install-nix-action's default (2.22.1): tarball-input narHashes differ
          across Nix versions, so an old CI Nix rejects a modern lock. Empty =
          installer default.
        type: string
        default: ""
    secrets:
      registry:
        description: Harbor host. Empty => external fork defaults are used.
        required: false
      registry-user:
        required: false
      registry-password:
        required: false
      dockerhub-token:
        description: Docker Hub token. When set, the build also logs in to Docker
          Hub so bare-repo extra-tags are pushed there too.
        required: false
      cachix-auth-token:
        description: Cachix auth token (needed to push to the cache; pulls work
          without it). Leave unset on forks.
        required: false
    outputs:
      image-ref:
        description: Fully-qualified Harbor image reference that was pushed
        value: ${{ jobs.build.outputs.image-ref }}

jobs:
  build:
    runs-on: ${{ inputs.runs-on }}
    env:
      # Same fallback ladder as build-and-push.yml: internal builds use the
      # Harbor secrets; fork/external builds fall through to the public proxy +
      # read-only "external" credentials (org variable EXTERNAL_REGISTRY_PASS).
      REGISTRY: ${{ secrets.registry || 'harbor.harbor.svc.cluster.local' }}
      REGISTRY_USER: ${{ secrets.registry-user || 'external' }}
      TARGET: ${{ secrets.registry || 'harbor.harbor.svc.cluster.local/external' }}
      PASSWORD: ${{ secrets.registry-password || vars.EXTERNAL_REGISTRY_PASS }}
      DOCKERHUB_TOKEN: ${{ secrets.dockerhub-token }}
      # Runner quirks on the self-hosted Arc pool: Nix/Cachix expect USER/HOME-ish
      # vars and a writable TMPDIR/cache (mirrors rehosting/penguin-tools).
      USER: runner
      LOGNAME: runner
      TMPDIR: /home/runner/_work/_temp
      XDG_CACHE_HOME: /home/runner/_work/.cache
    outputs:
      image-ref: ${{ steps.push.outputs.image-ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: ${{ inputs.fetch-depth }}
          ref: ${{ inputs.checkout-ref }}

      - name: Prepare runner directories
        shell: bash
        run: mkdir -p "$TMPDIR" "$XDG_CACHE_HOME"

      - name: Set up Nix
        uses: rehosting/ci/actions/nix-setup@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          install-url: ${{ inputs.nix-install-url }}
          extra-nix-config: |
            max-jobs = 8
            cores = 8
          cache-backend: ${{ inputs.cachix-name != '' && 'cachix' || 'none' }}
          cachix-name: ${{ inputs.cachix-name }}
          cachix-auth-token: ${{ secrets.cachix-auth-token }}
          enable-kvm: ${{ inputs.enable-kvm }}
          skip-push: ${{ inputs.cachix-skip-push }}

      - name: Flake check
        if: ${{ inputs.flake-check }}
        run: nix flake check -L

      - name: Build image
        shell: bash
        run: |
          set -euo pipefail
          # Optional build-time env (one KEY=VALUE per line), e.g. a release
          # version the flake reads via builtins.getEnv (needs --impure in
          # extra-build-args).
          while IFS= read -r line; do
            [ -n "$line" ] && export "$line"
          done <<< '${{ inputs.build-env }}'
          nix build -L ${{ inputs.extra-build-args }} "${{ inputs.flake-attr }}"

      - name: Set up Arc registry (cert + login, no buildx)
        uses: rehosting/ci/actions/arc-registry-setup@v1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USER }}
          password: ${{ env.PASSWORD }}
          setup-buildx: "false"

      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ inputs.dockerhub-user }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Tag and push
        id: push
        if: ${{ inputs.push }}
        shell: bash
        run: |
          set -euo pipefail
          sha_ref="${TARGET}/${{ inputs.image }}:${GITHUB_SHA}"

          tags=()
          if [ '${{ inputs.tag-sha }}' = 'true' ]; then
            tags+=("$sha_ref")
          fi
          while IFS= read -r t; do
            [ -n "$t" ] && tags+=("$t")
          done <<< '${{ inputs.extra-tags }}'

          # Push with skopeo rather than `docker load` + `docker push`.
          #
          # WHY NOT docker: dockerTools writes each layer as an UNCOMPRESSED tar
          # diff, and the docker path published them that way -- 114 of penguin
          # v3.1.1's 115 layers landed in the registry as
          # `application/vnd.docker.image.rootfs.diff.tar` (no `.gzip`), so the
          # tag weighed 3.573 GB where the same image gzips to ~1.75 GB. That
          # made the first Nix-built release look ~4% BIGGER than the
          # Dockerfile one it actually halves. Skipping `docker load` also keeps
          # a multi-GB image out of the per-node shared Docker daemon, which is
          # already disk-pressured.
          #
          # Auth: arc-registry-setup and docker/login-action have already
          # written ~/.docker/config.json, which skopeo reads. Harbor's
          # self-signed cert is in the *system* trust store (arc-registry-setup
          # runs update-ca-certificates), which skopeo honours, so TLS
          # verification stays on.
          # Prefer a preinstalled skopeo; otherwise run one from nixpkgs (Nix is
          # already set up by this point, so this needs no apt).
          #
          # Use `nix shell --command`, NOT a path derived from
          # `nix build --print-out-paths`: skopeo is a multi-output derivation, so
          # that prints BOTH `...-skopeo-1.24.0-man` and `...-skopeo-1.24.0`.
          # Capturing it produced a two-line "path" and failed the release with
          # `No such file or directory` / exit 127. `nix shell` selects the
          # right output itself.
          skopeo=(skopeo)
          if ! command -v skopeo >/dev/null 2>&1; then
            skopeo=(nix shell nixpkgs#skopeo --command skopeo)
          fi
          "${skopeo[@]}" --version

          # Two phases: compress locally, then upload. NOT a straight
          # archive->registry copy, because skopeo asks the destination "do you
          # already have this blob?" using the *source* layer digest.
          # dockerTools' archive presents UNCOMPRESSED digests, so any repo that
          # has ever received an uncompressed push -- as penguin's had -- still
          # holds blobs under exactly those digests. skopeo then reuses them and
          # skips compressing, while still writing `.tar.gzip` into the
          # manifest: an image that is both oversized AND mislabeled. That is
          # what penguin v3.1.2 shipped (112 of 115 layers were plain tar
          # declared as gzip, 3.501 GB). Compressing into a local `dir:` first
          # makes the upload's source digests the *compressed* ones, which don't
          # collide, so layers really are compressed and correctly labeled
          # regardless of what the registry already holds.
          #
          # --insecure-policy: skopeo refuses to run without a containers trust
          # policy and the runners ship no policy.json in any searched path
          # (~/.config/containers, /etc/containers, /usr/share/containers). We
          # verify no signatures here (neither did `docker push`), so skip the
          # check rather than install a policy.json saying
          # insecureAcceptAnything, which is equivalent.
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT

          # The two phases MUST NOT share a blob-info cache. containers/image
          # records compressed<->uncompressed digest pairs under
          # $XDG_DATA_HOME/containers/cache. Phase 1 necessarily learns the pair
          # for every layer, so if phase 2 reads the same cache it can look up
          # the *uncompressed* digest, find the stale blob in the destination and
          # reuse it -- reintroducing exactly the bug this structure exists to
          # avoid. Verified against a registry pre-seeded with an uncompressed
          # blob: sharing the cache reuses it (8697856 bytes, declared `tar`),
          # separate caches upload real gzip (3838379 bytes). Fresh per-phase
          # directories also make this independent of whatever the runner has in
          # its home directory.
          mkdir -p "$workdir/xdg1" "$workdir/xdg2"

          echo "Compressing layers (gzip level 9)"
          XDG_DATA_HOME="$workdir/xdg1" "${skopeo[@]}" --insecure-policy copy \
            --dest-compress --dest-compress-format gzip --dest-compress-level 9 \
            "docker-archive:result" "dir:$workdir/img"

          for t in "${tags[@]}"; do
            echo "Pushing $t"
            XDG_DATA_HOME="$workdir/xdg2" "${skopeo[@]}" --insecure-policy copy \
              --dest-authfile "$HOME/.docker/config.json" \
              "dir:$workdir/img" \
              "docker://$t"
          done

          echo "image-ref=$sha_ref" >> "$GITHUB_OUTPUT"
